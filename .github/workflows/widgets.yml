name: Update Streak & Trophy Widgets

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}     # manual trigger from the Actions tab

jobs:
  update-widgets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Generate streak stats SVG
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output-path: profile/streak-dark.svg
          theme: dark
          hide-border: true

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ rajesh1998choudhury }}
          file: profile/trophy.svg
          token: ${{ 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 }}
          no-frame: true

      - name: Commit generated widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update streak & trophy widgets" || echo "No changes to commit"
          git push
